<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de hojas de estilo a un formulario</title>
    <link rel="stylesheet" href="STYLES34.css">
</head>
<body>
    <div id="contenedorform">
    <form method="post" action="#">
        <label>Ingrese nombre:</label>
        <input type="text" name="nombre" size="30">
        <br>
        <label>Ingrese mail:</label>
        <input type="text" name="mail" size="45">
        <br>
        <label>Comentarios:</label>
        <textarea name="comentarios" cols="30" rows="5"></textarea>
        <br>
        <input class="botonsubmit" type="submit" value="confirmar">
    </form>
    </div>
</body>
</html>
